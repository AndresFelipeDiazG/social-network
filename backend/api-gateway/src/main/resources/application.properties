spring.application.name=api-gateway
server.port=8080

spring.config.import=optional:file:../../.env[.properties]

# Los nombres de servicio los resuelve el DNS interno de Docker. Los valores por
# defecto apuntan a los puertos publicados, para ejecutar el gateway fuera de
# contenedor contra los servicios ya levantados.
social.gateway.auth-service-url=${AUTH_SERVICE_URL:http://localhost:8081}
social.gateway.post-service-url=${POST_SERVICE_URL:http://localhost:8082}
social.gateway.allowed-origins=${FRONTEND_ORIGIN:http://localhost:4200}

# El mismo secreto que auth-service y post-service: aqui solo se verifica.
social.jwt.secret=${JWT_SECRET}
social.jwt.issuer=${JWT_ISSUER:social-auth-service}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Una sola interfaz de Swagger con desplegable para los dos servicios. Las rutas
# /api-docs/* las sirve el gateway por proxy: el navegador no puede resolver los
# nombres de servicio de la red de Docker.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/api-docs/auth
springdoc.swagger-ui.urls[1].name=post-service
springdoc.swagger-ui.urls[1].url=/api-docs/posts

# El filtro que anade las cabeceras X-Forwarded-* esta condicionado a declarar
# proxies de confianza: es una proteccion para no reenviarlas a ciegas. Sin ellas,
# los servicios generan su URL publica a partir del Host interno de Docker.
# En este entorno el unico proxy es este gateway, dentro de la red de Compose.
spring.cloud.gateway.server.webmvc.trusted-proxies=.*
