# Configuracion exclusiva de las pruebas. Sustituye al de src/main/resources, no lo
# complementa: comparten nombre en el classpath y el de test tiene prioridad.

spring.application.name=api-gateway

social.gateway.auth-service-url=http://localhost:18081
social.gateway.post-service-url=http://localhost:18082
social.gateway.allowed-origins=http://localhost:4200

social.jwt.secret=secreto-exclusivo-de-pruebas-con-mas-de-32-bytes
social.jwt.issuer=social-auth-service-test

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/api-docs/auth
springdoc.swagger-ui.urls[1].name=post-service
springdoc.swagger-ui.urls[1].url=/api-docs/posts
