# Configuracion exclusiva de las pruebas.
#
# Este archivo SUSTITUYE por completo al de src/main/resources durante los tests:
# comparten nombre en el classpath y el de test tiene prioridad, asi que no se
# combinan. Por eso repite lo que las pruebas necesitan en lugar de limitarse a
# las diferencias.
#
# Deliberadamente no importa el .env de la raiz: esta fuera del control de
# versiones y podria no existir en otra maquina, y una suite que depende de un
# archivo ignorado por git no es reproducible.

spring.application.name=auth-service

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

social.jwt.secret=secreto-exclusivo-de-pruebas-con-mas-de-32-bytes
social.jwt.issuer=social-auth-service-test
social.jwt.expiration=15m
