spring.application.name=post-service
server.port=8082

# Permite que el .env de la raiz sea la unica fuente de configuracion tambien al
# ejecutar el servicio fuera de Docker. El optional: evita que falle dentro del
# contenedor, donde no existe porque las variables ya llegan del entorno.
spring.config.import=optional:file:../../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:social_posts}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway es el dueno del esquema. Con ddl-auto=none Hibernate no lo altera por su
# cuenta, que es lo que enmascararia una migracion ausente.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# El mismo secreto que auth-service: alli se firma y aqui se verifica. Si difieren,
# el login funciona y las publicaciones devuelven 401, que es el fallo mas confuso
# de diagnosticar de todo el sistema.
social.jwt.secret=${JWT_SECRET}
social.jwt.issuer=${JWT_ISSUER:social-auth-service}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
