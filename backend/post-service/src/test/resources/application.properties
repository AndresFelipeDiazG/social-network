# Configuracion exclusiva de las pruebas.
#
# Este archivo SUSTITUYE al de src/main/resources durante los tests: comparten
# nombre en el classpath y el de test tiene prioridad, asi que no se combinan. Por
# eso repite lo que las pruebas necesitan en lugar de limitarse a las diferencias.
#
# Deliberadamente no importa el .env de la raiz: esta fuera del control de
# versiones, y una suite que depende de un archivo ignorado por git no es
# reproducible en otra maquina.

spring.application.name=post-service

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

social.jwt.secret=secreto-exclusivo-de-pruebas-con-mas-de-32-bytes
social.jwt.issuer=social-auth-service-test

# Los mismos endpoints que expone la aplicacion. Si aqui se expusieran menos, una
# prueba podria fallar por un 404 y parecer un problema de seguridad: es justo lo
# que pasa al sustituir este archivo al de main en lugar de complementarlo.
management.endpoints.web.exposure.include=health,info
