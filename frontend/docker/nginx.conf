# Sirve la aplicacion compilada y hace de proxy inverso para /api. Al compartir
# origen con la API, el navegador no hace peticiones cruzadas: CORS deja de
# existir en lugar de configurarse.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker asigna una IP nueva cada vez que recrea un contenedor. nginx
    # resuelve los nombres una sola vez al arrancar, asi que sin un resolver
    # explicito se quedaria con la IP antigua del gateway. 127.0.0.11 es el DNS
    # interno de Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Los bundles llevan un hash en el nombre: cualquier cambio produce un
    # nombre distinto, asi que se pueden cachear indefinidamente.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html y config.js determinan que version y que configuracion recibe
    # el cliente. Si se cachean, un despliegue nuevo no llega al navegador y
    # cambiar el .env no surte efecto. El match exacto tiene prioridad sobre la
    # expresion regular de arriba, asi que estas dos reglas ganan.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Las rutas de Angular solo existen en JavaScript. Sin este fallback, quien
    # este en /posts y recargue con F5 recibe un 404: nginx busca un archivo en
    # esa ruta y no existe.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
